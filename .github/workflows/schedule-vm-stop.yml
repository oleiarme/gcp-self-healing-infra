# Stop VM: stop the MIG instance (standby pool) on night schedule or manual
# trigger. The VM is stopped, not deleted: boot disk and cached docker
# images survive, so the morning start skips the ~10 min image pull.
# Auth via Workload Identity Federation (same as deploy.yml, no JSON keys).
# Disable via VM_SCHEDULE_ENABLED=false GitHub variable.

name: "Stop VM"

on:
  schedule:
    # Hourly; the gate job only lets runs through 19:00-08:59 Europe/Lisbon.
    - cron: '5 * * * *'   # :05, not :00 (GitHub's busiest minute)
  workflow_dispatch: {}

concurrency:
  group: vm-schedule
  cancel-in-progress: false

jobs:
  gate:
    # GitHub runs scheduled workflows hours late, so this workflow is
    # triggered hourly and decides by the actual Europe/Lisbon time at run
    # time (handles winter/summer time). Stop window: 19:00-08:59.
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.check.outputs.run }}
    steps:
      - id: check
        env:
          EVENT: ${{ github.event_name }}
        run: |
          HOUR=$(TZ=Europe/Lisbon date +%-H)
          RUN=false
          if [ "$EVENT" != "schedule" ]; then
            RUN=true
          elif [ "$HOUR" -ge 19 ] || [ "$HOUR" -lt 9 ]; then
            RUN=true
          fi
          echo "::notice::Lisbon time $(TZ=Europe/Lisbon date +%H:%M) -> run=$RUN"
          echo "run=$RUN" >> "$GITHUB_OUTPUT"

  stop:
    needs: gate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: >-
      needs.gate.outputs.run == 'true' && (
      github.event_name == 'workflow_dispatch' ||
      vars.VM_SCHEDULE_ENABLED != 'false')

    permissions:
      contents: read
      id-token: write

    env:
      GCP_PROJECT: ${{ vars.TF_VAR_project_id }}
      GCP_REGION: us-central1
      MIG_NAME: n8n-mig

    steps:
      - name: Checkout actions
        uses: actions/checkout@v6
        with:
          sparse-checkout: .github/actions
          sparse-checkout-cone-mode: false

      - name: Auth to GCP (WIF)
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.WIF_SA }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v3

      - name: Stop MIG instances
        id: stop
        run: |
          set -eo pipefail
          RUNNING=$(gcloud compute instance-groups managed list-instances "$MIG_NAME" \
            --region="$GCP_REGION" \
            --project="$GCP_PROJECT" \
            --filter="instanceStatus=RUNNING" \
            --format="value(instance.basename())") || {
            echo "::error::Failed to list MIG instances"
            exit 1
          }
          RUNNING=$(echo "$RUNNING" | awk 'NF' | paste -sd, -)

          if [ -z "$RUNNING" ]; then
            echo "::notice::No RUNNING instances in $MIG_NAME — skipping stop"
            # Hourly runs: nothing else to do (no Telegram).
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Policies are found by user_labels.nightly_snooze (monitoring.tf),
          # not by hardcoded IDs that go stale when a policy is recreated.
          #   fast → "n8n planned nightly shutdown"              (ended at healthy+10m)
          #   slo  → "n8n planned nightly shutdown (SLO windows)" (ended at healthy+6h)
          TOKEN=$(gcloud auth print-access-token)
          POLICIES_JSON=$(curl -sSf -G \
            -H "Authorization: Bearer $TOKEN" \
            --data-urlencode "pageSize=200" \
            "https://monitoring.googleapis.com/v3/projects/${GCP_PROJECT}/alertPolicies") || {
            echo "::warning::Could not list alert policies — VM will stop without a snooze"
            POLICIES_JSON='{}'
          }

          policies_for() {
            jq -r --arg g "$1" \
              '[.alertPolicies[]? | select(.userLabels.nightly_snooze == $g) | .name] | join(",")' \
              <<<"$POLICIES_JSON"
          }

          START_TIME=$(date -u +"%Y-%m-%dT%H:%M:%SZ")

          # Next occurrence of HH:MM Europe/Lisbon, as UTC RFC3339. The stop
          # runs 19:00-08:59 Lisbon (often after midnight, GitHub is late),
          # so "next" is today when we are still before HH:MM, else tomorrow.
          next_lisbon() {
            local hhmm="$1" day
            day=$(TZ=Europe/Lisbon date +%F)
            if ! [ "$(TZ=Europe/Lisbon date +%H%M)" \< "${hhmm/:/}" ]; then
              day=$(TZ=Europe/Lisbon date -d "$day 12:00 +1 day" +%F)
            fi
            date -u -d "TZ=\"Europe/Lisbon\" $day $hhmm" +"%Y-%m-%dT%H:%M:%SZ"
          }

          create_snooze() {
            local name="$1" policies="$2" end_time="$3"
            if [ -z "$policies" ]; then
              echo "::warning::No policies labelled for '$name' (terraform apply pending?) — skipping"
              return 0
            fi
            gcloud monitoring snoozes create \
              --project="$GCP_PROJECT" \
              --display-name="$name" \
              --criteria-policies="$policies" \
              --start-time="$START_TIME" \
              --end-time="$end_time" \
              --quiet || {
              echo "::warning::Failed to create snooze '$name'"
              return 0
            }
            echo "::notice::Snooze '$name': $START_TIME → $end_time ($policies)"
          }

          # Fixed end times: Cloud Scheduler (terraform/scheduler.tf) starts
          # the VM at 08:45 Lisbon and n8n is healthy ~4 min later, so the
          # symptom alerts come back at 09:05 and the burn-rate alerts after
          # their 6 h window ages out (15:05). The GitHub Start VM workflow
          # is a late fallback; when it does start the VM it still shortens
          # both snoozes once n8n is healthy.
          create_snooze "n8n planned nightly shutdown" "$(policies_for fast)" "$(next_lisbon 09:05)"
          create_snooze "n8n planned nightly shutdown (SLO windows)" "$(policies_for slo)" "$(next_lisbon 15:05)"

          echo "::notice::stop — stopping $RUNNING in $MIG_NAME (standby pool)"

          gcloud compute instance-groups managed stop-instances "$MIG_NAME" \
            --instances="$RUNNING" \
            --region="$GCP_REGION" \
            --project="$GCP_PROJECT" \
            --quiet

      - name: Send Telegram notification
        if: always() && vars.TELEGRAM_CHAT_ID != '' && steps.stop.outputs.changed != 'false'
        uses: ./.github/actions/telegram-notify
        with:
          bot_token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          chat_id: ${{ vars.TELEGRAM_CHAT_ID }}
          thread_id: ${{ vars.TELEGRAM_THREAD_ID }}
          status: ${{ job.status }}
          action: stop
          trigger: ${{ github.event_name }}