# Stop VM: resize MIG to 0 on night schedule or manual trigger.
# Auth via Workload Identity Federation (same as deploy.yml, no JSON keys).
# Disable via VM_SCHEDULE_ENABLED=false GitHub variable.

name: "Stop VM"

on:
  schedule:
    - cron: '0 22 * * *'  # 22:00 UTC Mon-Sun
  workflow_dispatch: {}

concurrency:
  group: vm-schedule
  cancel-in-progress: false

jobs:
  stop:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: >-
      github.event_name == 'workflow_dispatch' ||
      vars.VM_SCHEDULE_ENABLED != 'false'

    permissions:
      contents: read
      id-token: write

    env:
      GCP_PROJECT: ${{ vars.TF_VAR_project_id }}
      GCP_REGION: us-central1
      MIG_NAME: n8n-mig

    steps:
      - name: Checkout actions
        uses: actions/checkout@v7
        with:
          sparse-checkout: .github/actions
          sparse-checkout-cone-mode: false

      - name: Auth to GCP (WIF)
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.WIF_SA }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v3

      - name: Resize MIG to 0
        run: |
          CURRENT_SIZE=$(gcloud compute instance-groups managed describe "$MIG_NAME" \
            --region="$GCP_REGION" \
            --project="$GCP_PROJECT" \
            --format="value(targetSize)" 2>/dev/null) || {
            echo "::error::Failed to get MIG size"
            exit 1
          }

          echo "::notice::Current MIG target size: $CURRENT_SIZE"

          if [ "$CURRENT_SIZE" = "0" ]; then
            echo "::notice::MIG already at size=0 — skipping resize"
            exit 0
          fi

          # Policies are found by user_labels.nightly_snooze (monitoring.tf),
          # not by hardcoded IDs that go stale when a policy is recreated.
          #   fast → "n8n planned nightly shutdown"              (ended at healthy+10m)
          #   slo  → "n8n planned nightly shutdown (SLO windows)" (ended at healthy+6h)
          TOKEN=$(gcloud auth print-access-token)
          POLICIES_JSON=$(curl -sSf -G \
            -H "Authorization: Bearer $TOKEN" \
            --data-urlencode "pageSize=200" \
            "https://monitoring.googleapis.com/v3/projects/${GCP_PROJECT}/alertPolicies") || {
            echo "::warning::Could not list alert policies — VM will stop without a snooze"
            POLICIES_JSON='{}'
          }

          policies_for() {
            jq -r --arg g "$1" \
              '[.alertPolicies[]? | select(.userLabels.nightly_snooze == $g) | .name] | join(",")' \
              <<<"$POLICIES_JSON"
          }

          START_TIME=$(date -u +"%Y-%m-%dT%H:%M:%SZ")

          create_snooze() {
            local name="$1" policies="$2" hours="$3"
            if [ -z "$policies" ]; then
              echo "::warning::No policies labelled for '$name' (terraform apply pending?) — skipping"
              return 0
            fi
            local end_time
            end_time=$(date -u -d "+${hours} hours" +"%Y-%m-%dT%H:%M:%SZ")
            gcloud monitoring snoozes create \
              --project="$GCP_PROJECT" \
              --display-name="$name" \
              --criteria-policies="$policies" \
              --start-time="$START_TIME" \
              --end-time="$end_time" \
              --quiet || {
              echo "::warning::Failed to create snooze '$name'"
              return 0
            }
            echo "::notice::Snooze '$name': $START_TIME → $end_time ($policies)"
          }

          # Upper bounds only: schedule-vm-start.yml shortens both once n8n is
          # healthy. Scheduled runs start 1-3 h late, hence the slack.
          create_snooze "n8n planned nightly shutdown" "$(policies_for fast)" 14
          create_snooze "n8n planned nightly shutdown (SLO windows)" "$(policies_for slo)" 20

          echo "::notice::stop — resizing $MIG_NAME from $CURRENT_SIZE to 0"

          gcloud compute instance-groups managed resize "$MIG_NAME" \
            --size=0 \
            --region="$GCP_REGION" \
            --project="$GCP_PROJECT" \
            --quiet

      - name: Send Telegram notification
        if: always() && vars.TELEGRAM_CHAT_ID != ''
        uses: ./.github/actions/telegram-notify
        with:
          bot_token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          chat_id: ${{ vars.TELEGRAM_CHAT_ID }}
          thread_id: ${{ vars.TELEGRAM_THREAD_ID }}
          status: ${{ job.status }}
          action: stop
          trigger: ${{ github.event_name }}