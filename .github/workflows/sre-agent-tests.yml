name: SRE Agent Tests

on:
  push:
    paths:
      - 'terraform/functions/sre_agent/**'
  pull_request:
    paths:
      - 'terraform/functions/sre_agent/**'
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: terraform/functions/sre_agent

    steps:
      - uses: actions/checkout@v6

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: terraform/functions/sre_agent/requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Run tests with coverage
        run: |
          python -m pytest tests/ \
            --tb=short \
            --cov=sre_agent \
            --cov-report=term-missing \
            --cov-fail-under=70 \
            -q

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: terraform/functions/sre_agent/htmlcov/
          retention-days: 7
