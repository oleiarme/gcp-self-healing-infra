# docker-compose.cos.yml — COS (Container-Optimized OS) variant
# All services have label container_name and logging driver json-file
# with max-size: "10m", max-file: "3" per Requirements 8.4, 8.5
#
# Environment variables expected in .env:
#   DB_PASSWORD, N8N_KEY, CF_TOKEN, N8N_IMAGE, CLOUDFLARED_IMAGE, DATA_DIR

services:
  postgres:
    image: postgres:15-alpine
    restart: unless-stopped
    labels:
      container_name: "postgres"
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_DB: ${DB_NAME:-n8n}
      POSTGRES_USER: ${DB_USER:-n8n}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-n8n} -d ${DB_NAME:-n8n}"]
      interval: 5s
      timeout: 3s
      retries: 5
    volumes:
      - ${DATA_DIR}/postgres:/var/lib/postgresql/data
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  n8n:
    image: ${N8N_IMAGE}
    restart: unless-stopped
    labels:
      container_name: "n8n"
    ports:
      - "127.0.0.1:5678:5678"
    environment:
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: postgres
      DB_POSTGRESDB_PORT: 5432
      DB_POSTGRESDB_DATABASE: ${DB_NAME:-n8n}
      DB_POSTGRESDB_USER: ${DB_USER:-n8n}
      DB_POSTGRESDB_PASSWORD: ${DB_PASSWORD}
      N8N_ENCRYPTION_KEY: ${N8N_KEY}
      N8N_EXECUTIONS_MODE: regular
      N8N_CONCURRENCY_PRODUCTION_LIMIT: 1
      N8N_LOG_LEVEL: error
      EXECUTIONS_DATA_SAVE_ON_SUCCESS: none
      EXECUTIONS_DATA_SAVE_ON_ERROR: all
      EXECUTIONS_DATA_PRUNE: "true"
      EXECUTIONS_DATA_MAX_AGE_HISTORY: 24
      N8N_RUNNERS_ENABLED: "true"
      N8N_RUNNERS_MODE: internal
      N8N_HOST: n8n-gcp.pp.ua
      N8N_PROTOCOL: https
      WEBHOOK_URL: https://n8n-gcp.pp.ua/
      N8N_DIAGNOSTICS_ENABLED: "false"
      N8N_PORT: 5678
      N8N_LISTEN_ADDRESS: 0.0.0.0
      DB_POSTGRESDB_CONNECTION_TIMEOUT: 60000
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:5678/healthz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 420s
    depends_on:
      postgres:
        condition: service_healthy
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  cloudflared:
    image: ${CLOUDFLARED_IMAGE}
    restart: unless-stopped
    labels:
      container_name: "cloudflared"
    command: tunnel --no-autoupdate --protocol http2 --metrics 0.0.0.0:2000 run --token ${CF_TOKEN}
    ports:
      - "127.0.0.1:2000:2000"
    depends_on:
      n8n:
        condition: service_healthy
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  healthz-sidecar:
    build:
      context: ./healthz-sidecar
    restart: unless-stopped
    labels:
      container_name: "healthz-sidecar"
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      N8N_URL: "http://n8n:5678/rest/active-workflows"
      POSTGRES_HOST: "postgres"
      POSTGRES_PORT: "5432"
      POSTGRES_USER: "${DB_USER:-n8n}"
      POSTGRES_DB: "${DB_NAME:-n8n}"
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      CLOUDFLARED_METRICS_URL: "http://cloudflared:2000/ready"
      BOOTSTRAP_WINDOW_SECONDS: "1800"
    depends_on:
      postgres:
        condition: service_healthy
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
