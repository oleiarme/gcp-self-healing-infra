name: Deploy n8n Infrastructure

on:
  push:
    branches: [ main, infra-rewrite-experiment ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true


env:
  # Single source of truth for hardcoded defaults when GitHub Variables are empty.
  # Update these only when bumping the baseline version for the entire repo.
  DEFAULT_N8N_IMAGE: "docker.io/n8nio/n8n:2.19.5@sha256:b1b0c592735e24acd3cc64db83f94ef4efd8e331e47c6883249cc51cc1bea16b"
  DEFAULT_N8N_TAG: "2.19.5"
  DEFAULT_CF_IMAGE: "cloudflare/cloudflared:2026.3.0@sha256:6b599ca3e974349ead3286d178da61d291961182ec3fe9c505e1dd02c8ac31b0"
  DEFAULT_CF_TAG: "2026.3.0"

jobs:
  terraform:
    runs-on: ubuntu-latest
    # GitHub Environment "production" is the deploy approval gate. Configure
    # it under Settings → Environments → production with at least one
    # required reviewer (and ideally a wait timer + branch restriction to
    # `main`). All `terraform apply` runs go through this human approval.
    environment: production
    defaults:
      run:
        working-directory: ./terraform # Все команды будут выполняться здесь

    permissions:
      contents: read
      id-token: write

    env:
      PROJECT: ${{ vars.TF_VAR_project_id }}
      REGION: ${{ vars.TF_VAR_region || 'us-central1' }}
      AR_REPO: n8n-docker
      # Resolve image refs: GitHub var > workflow default (mirrors variables.tf)
      N8N_IMAGE: ${{ vars.TF_VAR_n8n_image || env.DEFAULT_N8N_IMAGE }}
      CF_IMAGE: ${{ vars.TF_VAR_cloudflared_image || env.DEFAULT_CF_IMAGE }}
      N8N_TAG: ${{ vars.TF_VAR_n8n_image_tag || env.DEFAULT_N8N_TAG }}
      CF_TAG: ${{ vars.TF_VAR_cloudflared_image_tag || env.DEFAULT_CF_TAG }}
      # Terraform auto-picks these up via TF_VAR_ prefix
      TF_VAR_n8n_image: ${{ vars.TF_VAR_n8n_image || env.DEFAULT_N8N_IMAGE }}
      TF_VAR_n8n_image_tag: ${{ vars.TF_VAR_n8n_image_tag || env.DEFAULT_N8N_TAG }}
      TF_VAR_cloudflared_image: ${{ vars.TF_VAR_cloudflared_image || env.DEFAULT_CF_IMAGE }}
      TF_VAR_cloudflared_image_tag: ${{ vars.TF_VAR_cloudflared_image_tag || env.DEFAULT_CF_TAG }}
      TF_VAR_project_id: ${{ vars.TF_VAR_project_id }}
      TF_VAR_region: ${{ vars.TF_VAR_region || 'us-central1' }}
      TF_VAR_db_host: ${{ vars.TF_VAR_db_host }}
      TF_VAR_db_user: ${{ vars.TF_VAR_db_user }}
      TF_VAR_n8n_public_host: ${{ vars.TF_VAR_n8n_public_host }}
      TF_VAR_oncall_email: ${{ vars.TF_VAR_oncall_email }}
      TF_VAR_backup_bucket_name: ${{ vars.BACKUP_BUCKET_NAME }}
      TF_VAR_slack_channel: ${{ vars.TF_VAR_slack_channel || '#n8n-ops' }}
      TF_VAR_telegram_chat_id: ${{ vars.TELEGRAM_CHAT_ID }}
      TF_VAR_telegram_thread_id: ${{ vars.TELEGRAM_THREAD_ID }}
      TF_VAR_wif_allowed_repository: ${{ github.repository }}
      TF_VAR_github_repository_url: ${{ github.server_url }}/${{ github.repository }}

    steps:
      - uses: actions/checkout@v6

      - name: Auth to GCP
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.WIF_SA }}
          
      
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4

      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@v3

      - name: Terraform Init
        run: |
          terraform init -reconfigure \
            -backend-config="bucket=${{ secrets.TF_BACKEND_BUCKET }}" \
            -backend-config="prefix=terraform/state"
          

      - name: Terraform Validate
        run: terraform validate
          
      # Mirror public images into AR BEFORE plan/apply so the new VM finds
      # the correct digest-tagged image immediately.  Skips on first deploy
      # when the AR repo doesn't exist yet (VM falls back to public).
      #
      # Image refs are passed as explicit env vars (no file parsing).
      # Defaults mirror terraform/variables.tf — update both on version bumps.
      - name: Mirror images to Artifact Registry
        id: mirror
        continue-on-error: false
        working-directory: .
        run: |
          set -eo pipefail
          AR="${REGION}-docker.pkg.dev/${PROJECT}/${AR_REPO}"
          # Check if AR repo exists (skip on first deploy)
          if ! gcloud artifacts repositories describe "$AR_REPO" \
               --location="$REGION" --project="$PROJECT" \
               --format="value(name)" 2>/dev/null; then
            echo "::notice::BOOTSTRAP MODE: VM will pull from public registry"
            exit 0
          fi
          gcloud auth configure-docker "${REGION}-docker.pkg.dev" --quiet
          # Digest-short prefix (first 8 chars) — mirrors terraform locals
          N8N_DS="${N8N_IMAGE##*@sha256:}"; N8N_DS="${N8N_DS:0:8}"
          CF_DS="${CF_IMAGE##*@sha256:}"; CF_DS="${CF_DS:0:8}"
          for PAIR in "${N8N_IMAGE} ${AR}/n8n:${N8N_TAG}-${N8N_DS}" \
                      "${CF_IMAGE} ${AR}/cloudflared:${CF_TAG}-${CF_DS}"; do
            SRC="${PAIR%% *}"
            DST="${PAIR#* }"
            echo ">>> Mirroring ${SRC} → ${DST}"
            docker pull "${SRC}"
            docker tag  "${SRC}" "${DST}"
            for i in {1..5}; do
              docker push "${DST}" && break
              echo "Push retry $i..."
              sleep 5
            done
            AR_DIGEST=$(docker inspect --format='{{index .RepoDigests 0}}' "${DST}" 2>/dev/null || echo "unknown")
            echo "    AR digest: ${AR_DIGEST}"
          done
          sleep 5 

          echo ">>> Verifying images in Artifact Registry..."

          gcloud artifacts docker images list "${AR}/n8n" --include-tags \
            --format="get(TAGS)" | grep "${N8N_TAG}-${N8N_DS}"

          gcloud artifacts docker images list "${AR}/cloudflared" --include-tags \
            --format="get(TAGS)" | grep "${CF_TAG}-${CF_DS}"
          echo ">>> Testing docker pull from Artifact Registry..."

          for i in {1..5}; do
            docker pull "${AR}/n8n:${N8N_TAG}-${N8N_DS}" && break
            echo "Pull retry $i..."
            sleep 5
          done

          for i in {1..5}; do
            docker pull "${AR}/cloudflared:${CF_TAG}-${CF_DS}" && break
            echo "Pull retry $i..."
            sleep 5
          done
          done
          sleep 5 

      - name: Warn on mirror failure
        if: steps.mirror.outcome == 'failure'
        run: |
          echo "::warning::Artifact Registry mirror failed. VMs will fall back to public registries (slower boots, Docker Hub rate limits apply)."

      - name: Terraform Plan
        run: terraform plan -out=tfplan
        env:
          TF_VAR_CF_TUNNEL_TOKEN: ${{ secrets.TF_VAR_CF_TUNNEL_TOKEN }}
          TF_VAR_db_password: ${{ secrets.TF_VAR_db_password }}
          TF_VAR_n8n_encryption_key: ${{ secrets.TF_VAR_n8n_encryption_key }}
          TF_VAR_billing_account_id: ${{ secrets.GCP_BILLING_ACCOUNT_ID }}
          TF_VAR_slack_auth_token: ${{ secrets.SLACK_BOT_TOKEN }}
          TF_VAR_telegram_bot_token: ${{ secrets.TELEGRAM_BOT_TOKEN }}

      - name: Terraform Apply
        #run: terraform apply -replace=google_compute_instance_template.tpl -auto-approve
        run: terraform apply -auto-approve tfplan
        continue-on-error: false
        env:
          TF_VAR_CF_TUNNEL_TOKEN: ${{ secrets.TF_VAR_CF_TUNNEL_TOKEN }}
          TF_VAR_db_password: ${{ secrets.TF_VAR_db_password }}
          TF_VAR_n8n_encryption_key: ${{ secrets.TF_VAR_n8n_encryption_key }}
          TF_VAR_billing_account_id: ${{ secrets.GCP_BILLING_ACCOUNT_ID }}
          TF_VAR_slack_auth_token: ${{ secrets.SLACK_BOT_TOKEN }}
          TF_VAR_telegram_bot_token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
