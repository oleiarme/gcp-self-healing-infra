name: App Deploy (In-Place)
# Shearing Layers: infrastructure changes rarely, application changes often.
# This workflow updates Docker containers on the running VM via SSH (IAP),
# without recreating the VM. Downtime: roughly one container restart
# vs 1-3 minutes (MIG RECREATE).
#
# Use this for: n8n version bumps, cloudflared updates, config changes.
# Use deploy.yml for: disk size, network, firewall, MIG, IAM changes.
on:
  workflow_dispatch:
    inputs:
      n8n_image:
        description: 'n8n image ref (tag@digest). Leave empty to use default from variables.tf'
        required: false
        type: string
      cloudflared_image:
        description: 'cloudflared image ref (tag@digest). Leave empty to use default'
        required: false
        type: string
      skip_mirror:
        description: 'Skip AR mirror step (image already in AR)'
        required: false
        type: boolean
        default: false
concurrency:
  group: app-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: In-Place Deploy
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      id-token: write
    env:
      PROJECT: ${{ vars.TF_VAR_project_id }}
      REGION: ${{ vars.TF_VAR_region || 'us-central1' }}
      ZONE: ${{ vars.TF_VAR_zone || 'us-central1-a' }}
      AR_REPO: n8n-docker
      # Resolve image refs: workflow input > GitHub var > workflow default
      TF_VAR_n8n_image: ${{ inputs.n8n_image || vars.TF_VAR_n8n_image || 'docker.io/n8nio/n8n:1.123.42@sha256:9c6b47900464be0a00236ca2ee18f74e3a2be410d4fc4368f1b0eee602279cd5' }}
      TF_VAR_cloudflared_image: ${{ inputs.cloudflared_image || vars.TF_VAR_cloudflared_image || 'cloudflare/cloudflared:2026.3.0@sha256:6b599ca3e974349ead3286d178da61d291961182ec3fe9c505e1dd02c8ac31b0' }}
      TF_VAR_n8n_image_tag: ${{ vars.TF_VAR_n8n_image_tag || '1.123.42' }}
      TF_VAR_cloudflared_image_tag: ${{ vars.TF_VAR_cloudflared_image_tag || '2026.3.0' }}
    steps:
      - uses: actions/checkout@v6
      - name: Auth to GCP
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.WIF_SA }}
      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@v3
      # Mirror images to AR (same logic as deploy.yml, reused for consistency)
      - name: Mirror images to Artifact Registry
        if: ${{ !inputs.skip_mirror }}
        continue-on-error: true
        run: |
          set -eo pipefail
          AR="${REGION}-docker.pkg.dev/${PROJECT}/${AR_REPO}"
          if ! gcloud artifacts repositories describe "$AR_REPO" \
               --location="$REGION" --project="$PROJECT" \
               --format="value(name)" 2>/dev/null; then
            echo "::notice::AR repo does not exist yet. Skipping mirror."
            exit 0
          fi
          gcloud auth configure-docker "${REGION}-docker.pkg.dev" --quiet
          N8N_DS="${TF_VAR_n8n_image##*@sha256:}"; N8N_DS="${N8N_DS:0:8}"
          CF_DS="${TF_VAR_cloudflared_image##*@sha256:}"; CF_DS="${CF_DS:0:8}"
          for PAIR in "${TF_VAR_n8n_image} ${AR}/n8n:${TF_VAR_n8n_image_tag}-${N8N_DS}" \
                      "${TF_VAR_cloudflared_image} ${AR}/cloudflared:${TF_VAR_cloudflared_image_tag}-${CF_DS}"; do
            SRC="${PAIR%% *}"
            DST="${PAIR#* }"
            echo ">>> Mirroring ${SRC} → ${DST}"
            docker pull "${SRC}"
            docker tag  "${SRC}" "${DST}"
            docker push "${DST}"
          done
      - name: Resolve VM instance
        id: vm
        run: |
          set -eo pipefail
          INSTANCE_URL=$(gcloud compute instance-groups managed list-instances n8n-mig \
            --region="${REGION}" --project="${PROJECT}" \
            --format="value(instance)" | head -1)
          INSTANCE="${INSTANCE_URL##*/}"
          ZONE_FROM_URL=$(echo "$INSTANCE_URL" | sed -n 's#.*/zones/\([^/]*\)/instances/.*#\1#p')
          if [ -z "$INSTANCE" ]; then
            echo "::error::No running instance found in MIG n8n-mig"
            exit 1
          fi
          if [ -z "$ZONE_FROM_URL" ]; then
            echo "::error::Could not parse zone from instance URL: $INSTANCE_URL"
            exit 1
          fi
          echo "instance=${INSTANCE}" >> "$GITHUB_OUTPUT"
          echo "zone=${ZONE_FROM_URL}" >> "$GITHUB_OUTPUT"
          echo "::notice::Target VM: ${INSTANCE} in ${ZONE_FROM_URL}"
      # SSH into the VM and do in-place container update
      - name: Deploy via SSH (IAP)
        run: |
          set -eo pipefail
          # Build AR image refs (same logic as startup.sh locals)
          AR="${REGION}-docker.pkg.dev/${PROJECT}/${AR_REPO}"
          N8N_DS="${TF_VAR_n8n_image##*@sha256:}"; N8N_DS="${N8N_DS:0:8}"
          CF_DS="${TF_VAR_cloudflared_image##*@sha256:}"; CF_DS="${CF_DS:0:8}"
          AR_N8N="${AR}/n8n:${TF_VAR_n8n_image_tag}-${N8N_DS}"
          AR_CF="${AR}/cloudflared:${TF_VAR_cloudflared_image_tag}-${CF_DS}"
          gcloud compute ssh "${{ steps.vm.outputs.instance }}" \
            --zone="${{ steps.vm.outputs.zone }}" \
            --project="${PROJECT}" \
            --tunnel-through-iap \
            --command="sudo env N8N_PRIMARY='${AR_N8N}' N8N_FALLBACK='${TF_VAR_n8n_image}' CF_PRIMARY='${AR_CF}' CF_FALLBACK='${TF_VAR_cloudflared_image}' bash -s" <<'REMOTE'
              set -eo pipefail
              echo '=== In-Place Deploy ==='

              COMPOSE_DIR="/var/lib/docker/compose/n8n"
              ENV_FILE="$COMPOSE_DIR/.env"

              if [ ! -f "$ENV_FILE" ]; then
                echo "Missing $ENV_FILE. Recreate the VM with the current startup_cos.sh first."
                exit 1
              fi

              # COS rootfs is read-only; Docker Compose V2 needs a writable config dir
              export DOCKER_CONFIG="/var/lib/docker/.docker-config"

              pull_with_fallback() {
                local name="$1"
                local primary="$2"
                local fallback="$3"
                local selected="$primary"
                if ! docker pull "$primary" >&2; then
                  echo "AR miss for $name, using public image" >&2
                  selected="$fallback"
                  docker pull "$selected" >&2
                fi
                printf "%s" "$selected"
              }

              N8N_TARGET=$(pull_with_fallback n8n "$N8N_PRIMARY" "$N8N_FALLBACK")
              CF_TARGET=$(pull_with_fallback cloudflared "$CF_PRIMARY" "$CF_FALLBACK")

              # Update image refs in .env (used by docker-compose.yml)
              sed -i "s|^N8N_IMAGE=.*|N8N_IMAGE=${N8N_TARGET}|" "$ENV_FILE"
              sed -i "s|^CLOUDFLARED_IMAGE=.*|CLOUDFLARED_IMAGE=${CF_TARGET}|" "$ENV_FILE"

              # Recreate containers with updated images (preserves all env vars from .env)
              cd "$COMPOSE_DIR"
              /var/lib/docker/cli-plugins/docker-compose up -d --force-recreate n8n cloudflared

              # Wait for n8n to become healthy
              for i in {1..30}; do
                if curl -sf http://127.0.0.1:5678/healthz >/dev/null 2>&1; then
                  echo 'n8n is healthy'
                  break
                fi
                sleep 2
              done

              echo '=== Deploy complete ==='
              /var/lib/docker/cli-plugins/docker-compose ps
          REMOTE
      # Quick health check after deploy
      - name: Verify deployment
        run: |
          echo "Waiting 30s for containers to stabilize..."
          sleep 30
          gcloud compute ssh "${{ steps.vm.outputs.instance }}" \
            --zone="${{ steps.vm.outputs.zone }}" \
            --project="${PROJECT}" \
            --tunnel-through-iap \
            --command="
              echo '=== Health Check ==='
              sudo docker ps --filter name=n8n --filter name=cloudflared
              echo ''
              echo '=== n8n logs (last 10 lines) ==='
              sudo docker logs --tail=10 n8n
            "
