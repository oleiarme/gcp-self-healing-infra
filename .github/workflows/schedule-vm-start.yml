# Start VM: start the stopped MIG instance (standby pool) on morning
# schedule or manual trigger. Fallback: resize MIG to 1 if it has no
# instance at all (first run after migration, or VM deleted by hand).
# Auth via Workload Identity Federation (same as deploy.yml, no JSON keys).
# Disable via VM_SCHEDULE_ENABLED=false GitHub variable.

name: "Start VM"

on:
  schedule:
    # Hourly; the gate job only lets runs through 09:00-18:59 Europe/Lisbon.
    - cron: '3 * * * *'   # :03, not :00 (GitHub's busiest minute)
  workflow_dispatch: {}

concurrency:
  group: vm-schedule
  cancel-in-progress: false

jobs:
  gate:
    # GitHub runs scheduled workflows hours late, so this workflow is
    # triggered hourly and decides by the actual Europe/Lisbon time at run
    # time (handles winter/summer time). Start window: 09:00-18:59.
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.check.outputs.run }}
    steps:
      - id: check
        env:
          EVENT: ${{ github.event_name }}
        run: |
          HOUR=$(TZ=Europe/Lisbon date +%-H)
          RUN=false
          if [ "$EVENT" != "schedule" ]; then
            RUN=true
          elif [ "$HOUR" -ge 9 ] && [ "$HOUR" -lt 19 ]; then
            RUN=true
          fi
          echo "::notice::Lisbon time $(TZ=Europe/Lisbon date +%H:%M) -> run=$RUN"
          echo "run=$RUN" >> "$GITHUB_OUTPUT"

  start:
    needs: gate
    runs-on: ubuntu-latest
    timeout-minutes: 65
    if: >-
      needs.gate.outputs.run == 'true' && (
      github.event_name == 'workflow_dispatch' ||
      vars.VM_SCHEDULE_ENABLED != 'false')

    permissions:
      contents: read
      id-token: write

    env:
      GCP_PROJECT: ${{ vars.TF_VAR_project_id }}
      GCP_REGION: us-central1
      MIG_NAME: n8n-mig
      N8N_HOST: ${{ vars.TF_VAR_n8n_public_host }}

    steps:
      - name: Checkout scripts & actions
        uses: actions/checkout@v6
        with:
          sparse-checkout: |
            .github/scripts
            .github/actions
          sparse-checkout-cone-mode: false

      - name: Auth to GCP (WIF)
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.WIF_SA }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v3

      - name: Start MIG instances
        id: start
        run: |
          set -eo pipefail
          INSTANCES=$(gcloud compute instance-groups managed list-instances "$MIG_NAME" \
            --region="$GCP_REGION" \
            --project="$GCP_PROJECT" \
            --format="value(instance.basename(),instanceStatus)") || {
            echo "::error::Failed to list MIG instances"
            exit 1
          }
          echo "::notice::MIG instances: $(echo "$INSTANCES" | awk 'NF' | paste -sd ';' -)"

          # Already up or booting: nothing to do (no health wait, no Telegram).
          if echo "$INSTANCES" | awk '$2 ~ /^(RUNNING|PROVISIONING|STAGING)$/ {f=1} END {exit !f}'; then
            echo "::notice::Instance already RUNNING/starting — skipping start"
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          STOPPED=$(echo "$INSTANCES" | awk '$2 ~ /^(TERMINATED|STOPPED|STOPPING)$/ {print $1}' | paste -sd, -)
          if [ -n "$STOPPED" ]; then
            echo "::notice::start — starting $STOPPED in $MIG_NAME (standby pool)"
            gcloud compute instance-groups managed start-instances "$MIG_NAME" \
              --instances="$STOPPED" \
              --region="$GCP_REGION" \
              --project="$GCP_PROJECT" \
              --quiet
          elif [ -z "$(echo "$INSTANCES" | awk 'NF')" ]; then
            echo "::notice::start — MIG has no instances, resizing $MIG_NAME to 1 (cold start)"
            gcloud compute instance-groups managed resize "$MIG_NAME" \
              --size=1 \
              --region="$GCP_REGION" \
              --project="$GCP_PROJECT" \
              --quiet
          else
            echo "::error::Unexpected MIG instance state, not touching it: $INSTANCES"
            exit 1
          fi

      - name: Wait for VM to become healthy
        if: steps.start.outputs.changed != 'false'
        run: |
          bash .github/scripts/wait-gcp-mig.sh \
            --name "$MIG_NAME" \
            --region "$GCP_REGION" \
            --project "$GCP_PROJECT" \
            --timeout 3600 \
            --verbose
      - name: Dump MIG state on failure
        if: failure()
        continue-on-error: true
        run: |
          echo "=== MIG INSTANCES ==="

          gcloud compute instance-groups managed list-instances "$MIG_NAME" \
            --region="$GCP_REGION" \
            --project="$GCP_PROJECT"

          echo "=== MIG DETAILS ==="

          gcloud compute instance-groups managed describe "$MIG_NAME" \
            --region="$GCP_REGION" \
            --project="$GCP_PROJECT"

      - name: Health check (n8n /healthz)
        if: env.N8N_HOST != '' && steps.start.outputs.changed != 'false'
        run: |
          bash .github/scripts/wait-url.sh \
            --url "https://$N8N_HOST/healthz" \
            --code 200 \
            --timeout 1800

      - name: End planned-shutdown snoozes
        if: success() && steps.start.outputs.changed != 'false'
        run: |
          # Symptom alerts: back on 10 min after n8n is healthy.
          # Burn-rate alerts: their 1h / 6h windows still hold the night's
          # failed probes, so they stay snoozed until those windows age out.
          shorten_snooze() {
            local name="$1" end_time="$2"
            gcloud monitoring snoozes list \
              --project="$GCP_PROJECT" \
              --filter="displayName='${name}'" \
              --format="value(name.basename(),interval.endTime)" |
            while read -r SNOOZE_ID SNOOZE_END; do
              if [[ "$SNOOZE_END" > "$end_time" ]]; then
                echo "::notice::Snooze '$name' $SNOOZE_ID: $SNOOZE_END → $end_time"
                gcloud monitoring snoozes update "$SNOOZE_ID" \
                  --project="$GCP_PROJECT" \
                  --end-time="$end_time" \
                  --quiet
              fi
            done
          }

          shorten_snooze "n8n planned nightly shutdown" \
            "$(date -u -d '+10 minutes' +"%Y-%m-%dT%H:%M:%SZ")"
          shorten_snooze "n8n planned nightly shutdown (SLO windows)" \
            "$(date -u -d '+6 hours 10 minutes' +"%Y-%m-%dT%H:%M:%SZ")"

      - name: Send Telegram notification
        if: always() && vars.TELEGRAM_CHAT_ID != '' && steps.start.outputs.changed != 'false'
        uses: ./.github/actions/telegram-notify
        with:
          bot_token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          chat_id: ${{ vars.TELEGRAM_CHAT_ID }}
          thread_id: ${{ vars.TELEGRAM_THREAD_ID }}
          status: ${{ job.status }}
          action: start
          trigger: ${{ github.event_name }}